services:
  - type: web
    name: quattro-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWELVEDATA_API_KEY
        sync: false   # you fill this in manually on Render dashboard
    healthCheckPath: /ping
    autoDeploy: true
